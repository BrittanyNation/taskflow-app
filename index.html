<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Taskflow — a fast, beautiful kanban task manager that runs entirely in your browser.">
<title>Taskflow — Kanban Task Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <h1 class="logo">Taskflow<span>.</span></h1>
    <div class="header-actions">
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="Search tasks…" aria-label="Search tasks">
      </div>
      <select id="filterPriority" aria-label="Filter by priority">
        <option value="all">All priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <button class="btn" id="addTaskBtn">+ New task</button>
    </div>
  </div>
  <div class="stats-bar" id="statsBar"></div>
</header>

<main class="board" id="board">
  <section class="column" data-status="todo">
    <div class="column-header">
      <h2><span class="dot-indicator todo"></span>To Do</h2>
      <span class="count" id="count-todo">0</span>
    </div>
    <div class="task-list" id="list-todo"></div>
  </section>
  <section class="column" data-status="doing">
    <div class="column-header">
      <h2><span class="dot-indicator doing"></span>In Progress</h2>
      <span class="count" id="count-doing">0</span>
    </div>
    <div class="task-list" id="list-doing"></div>
  </section>
  <section class="column" data-status="done">
    <div class="column-header">
      <h2><span class="dot-indicator done"></span>Done</h2>
      <span class="count" id="count-done">0</span>
    </div>
    <div class="task-list" id="list-done"></div>
  </section>
</main>

<!-- Task modal -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">New task</h2>
    <form id="taskForm">
      <label>
        Title
        <input type="text" id="taskTitle" required maxlength="80" placeholder="What needs doing?">
      </label>
      <label>
        Description
        <textarea id="taskDesc" rows="3" maxlength="300" placeholder="Details (optional)"></textarea>
      </label>
      <div class="form-row">
        <label>
          Priority
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>
          Status
          <select id="taskStatus">
            <option value="todo">To Do</option>
            <option value="doing">In Progress</option>
            <option value="done">Done</option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn">Save task</button>
      </div>
    </form>
  </div>
</div>

<template id="taskTemplate">
  <article class="task-card" draggable="true" tabindex="0">
    <span class="priority"></span>
    <h3 class="task-title"></h3>
    <p class="task-desc"></p>
    <div class="task-footer">
      <span class="task-date"></span>
      <div class="task-actions">
        <button class="icon-btn edit-btn" aria-label="Edit task">✎</button>
        <button class="icon-btn delete-btn" aria-label="Delete task">🗑</button>
      </div>
    </div>
  </article>
</template>

<footer class="app-footer">
  <p>Taskflow — a concept project by Brittany Nation · Data saves to your browser automatically</p>
</footer>

<script src="script.js"></script>
</body>
</html>
